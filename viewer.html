<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pi. — Vista 360°</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

<style>
  :root {
    --black: #0a0a0b;
    --white: #ffffff;
    --muted: #9a9aa3;
    --indigo: #6a5cf5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: var(--black); font-family: 'JetBrains Mono', monospace; }

  #panorama { width: 100%; height: 100%; }

  #header {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 18px clamp(16px, 4vw, 32px);
    background: linear-gradient(to bottom, rgba(10,10,11,0.9), rgba(10,10,11,0));
    color: var(--white);
    pointer-events: none;
  }
  #header a {
    pointer-events: auto;
    color: var(--muted);
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 0.05em;
    border: 1px solid rgba(255,255,255,0.16);
    padding: 6px 12px;
    border-radius: 3px;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  #header a:hover { border-color: var(--indigo); color: var(--white); }

  #header .info-block { text-align: right; }
  #header .logo {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 16px;
  }
  #header .logo .pi-tag {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 9px;
    color: var(--muted);
    margin-left: 4px;
  }
  #header .location {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    margin-top: 6px;
  }
  #header .date {
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0.03em;
  }

  #loading, #error {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--black);
    color: var(--white);
    font-size: 13px;
    z-index: 20;
    transition: opacity 0.4s ease;
    text-align: center;
    padding: 24px;
  }
  #error { display: none; }
  #error .code { color: var(--indigo); font-size: 11px; letter-spacing: 0.08em; }
  #error p { color: var(--muted); max-width: 40ch; line-height: 1.6; }
  #error a { pointer-events: auto; color: var(--indigo); text-decoration: underline; font-size: 12px; }
</style>
</head>
<body>

  <div id="header">
    <a href="historico.html" id="back-link">← Histórico</a>
    <div class="info-block">
      <div class="logo">Pi.<span class="pi-tag">π 3.14</span></div>
      <div class="location" id="cidade-nome">—</div>
      <div class="date" id="data-formatada"></div>
    </div>
  </div>

  <div id="loading">Carregando panorama...</div>

  <div id="error">
    <div class="code">ARQUIVO NÃO ENCONTRADO</div>
    <p id="error-msg"></p>
    <a href="historico.html">Voltar para o histórico</a>
  </div>

  <div id="panorama"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const cidade = params.get('cidade');
    const data = params.get('data');

    document.getElementById('back-link').href = 'historico.html' + (cidade ? '?cidade=' + encodeURIComponent(cidade) : '');

    function formatarData(iso) {
      const [ano, mes, dia] = iso.split('-');
      const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
      return `${dia} ${meses[parseInt(mes,10)-1]} ${ano}`;
    }

    if (!cidade || !data) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-msg').textContent = 'Faltam informações no link (cidade ou data).';
      document.getElementById('error').style.display = 'flex';
    } else {
      document.getElementById('cidade-nome').textContent = cidade;
      document.getElementById('data-formatada').textContent = formatarData(data);
      document.title = 'Pi. — ' + cidade + ' · ' + formatarData(data);

      const arquivo = `${cidade}-${data}-360.jpg`;

      const viewer = pannellum.viewer('panorama', {
        type: 'equirectangular',
        panorama: arquivo,
        autoLoad: true,
        autoRotate: -2,
        compass: false,
        showZoomCtrl: true,
        showFullscreenCtrl: true,
        hfov: 100,
        minHfov: 30,
        maxHfov: 120,
      });

      viewer.on('load', function() {
        document.getElementById('loading').style.opacity = '0';
        setTimeout(() => document.getElementById('loading').style.display = 'none', 400);
      });

      viewer.on('error', function() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error-msg').textContent =
          'Não encontramos o arquivo "' + arquivo + '" na pasta. Confirme se a foto foi enviada com esse nome exato.';
        document.getElementById('error').style.display = 'flex';
      });
    }
  </script>

</body>
</html>
